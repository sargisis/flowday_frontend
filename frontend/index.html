<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Primary Meta Tags -->
  <title>Flowday - The Operating System for Deep Work</title>
  <meta name="title" content="Flowday - The Operating System for Deep Work" />
  <meta name="description" content="Stop managing tasks. Start managing your attention. Flowday combines project management with neuro-science based focus tools. Enter deep work mode." />
  <meta name="keywords" content="productivity, focus mode, deep work, project management, pomodoro, task management, flow state" />
  <meta name="author" content="Flowday" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://flowday.app/" />
  <meta property="og:title" content="Flowday - The Operating System for Deep Work" />
  <meta property="og:description" content="Stop managing tasks. Start managing your attention. Flowday combines project management with neuro-science based focus tools." />
  <meta property="og:image" content="https://flowday.app/og-image.png" />
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://flowday.app/" />
  <meta property="twitter:title" content="Flowday - The Operating System for Deep Work" />
  <meta property="twitter:description" content="Stop managing tasks. Start managing your attention. Flowday combines project management with neuro-science based focus tools." />
  <meta property="twitter:image" content="https://flowday.app/og-image.png" />
  
  <!-- Performance: Preconnect to external domains -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  
  <!-- Theme Color -->
  <meta name="theme-color" content="#6366f1" />
  
  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Flowday" />
  <meta name="mobile-web-app-capable" content="yes" />
  
  <!-- Robots -->
  <meta name="robots" content="index, follow" />
</head>

<body>
  <div id="root">
    <!-- Loading fallback in case React fails to load -->
    <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #09090b; color: white; flex-direction: column; gap: 1rem;">
      <div style="width: 48px; height: 48px; border: 4px solid rgba(99, 102, 241, 0.2); border-top-color: #6366f1; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <p style="color: #a1a1aa;">Loading Flowday...</p>
    </div>
    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Fallback error handler if React fails to load
    window.addEventListener('error', function(e) {
      if (e.message && e.message.includes('Failed to fetch dynamically imported module')) {
        console.error('Module loading error:', e);
        document.getElementById('root').innerHTML = '<div style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #09090b; color: white; flex-direction: column; gap: 1rem; padding: 2rem; text-align: center;"><h1 style="color: #ef4444;">⚠️ Loading Error</h1><p style="color: #a1a1aa;">Failed to load application. Please refresh the page.</p><button onclick="location.reload()" style="padding: 0.75rem 1.5rem; background: #6366f1; color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 600;">Refresh Page</button></div>';
      }
    });
  </script>
</body>

</html>
