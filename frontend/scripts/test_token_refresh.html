<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Refresh Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            background: #f9f9f9;
            border-left: 4px solid #6366f1;
            border-radius: 4px;
        }
        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
            transition: all 0.2s;
        }
        button:hover {
            background: #4f46e5;
            transform: translateY(-1px);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .success {
            color: #10b981;
            font-weight: bold;
        }
        .error {
            color: #ef4444;
            font-weight: bold;
        }
        .info {
            color: #6366f1;
        }
        pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 13px;
        }
        .log {
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-entry {
            padding: 8px;
            margin: 4px 0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
        .log-info { background: #dbeafe; }
        .log-success { background: #d1fae5; }
        .log-error { background: #fee2e2; }
        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            width: 200px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 Token Refresh Test Suite</h1>
        <p>This page tests the automatic token refresh mechanism.</p>

        <!-- Test 1: Login -->
        <div class="test-section">
            <h3>📝 Test 1: Login</h3>
            <input type="email" id="email" placeholder="Email" value="test@flowday.com">
            <input type="password" id="password" placeholder="Password" value="password123">
            <br>
            <button onclick="testLogin()">Login</button>
            <div id="login-result"></div>
        </div>

        <!-- Test 2: Check Cookie -->
        <div class="test-section">
            <h3>🍪 Test 2: Check Refresh Cookie</h3>
            <button onclick="checkCookie()">Check Cookie</button>
            <div id="cookie-result"></div>
        </div>

        <!-- Test 3: Make Authenticated Request -->
        <div class="test-section">
            <h3>🔑 Test 3: Make Authenticated Request</h3>
            <button onclick="testAuthRequest()">Get User Profile</button>
            <div id="auth-result"></div>
        </div>

        <!-- Test 4: Force Expire Token -->
        <div class="test-section">
            <h3>⏱️ Test 4: Test Auto-Refresh</h3>
            <p>This will expire the access token and verify it auto-refreshes.</p>
            <button onclick="testAutoRefresh()">Force Expire & Test</button>
            <div id="refresh-result"></div>
        </div>

        <!-- Logs -->
        <div class="test-section">
            <h3>📋 Test Logs</h3>
            <button onclick="clearLogs()">Clear Logs</button>
            <div id="logs" class="log"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api/v1';
        
        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logs.insertBefore(entry, logs.firstChild);
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }

        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('login-result');
            
            try {
                log('Attempting login...', 'info');
                
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include', // Important for cookies
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('token', data.token);
                    
                    resultDiv.innerHTML = `<p class="success">✅ Login successful!</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>`;
                    log('Login successful. Token stored in localStorage.', 'success');
                } else {
                    const error = await response.json();
                    resultDiv.innerHTML = `<p class="error">❌ Login failed: ${error.error}</p>`;
                    log(`Login failed: ${error.error}`, 'error');
                }
            } catch (err) {
                resultDiv.innerHTML = `<p class="error">❌ Error: ${err.message}</p>`;
                log(`Login error: ${err.message}`, 'error');
            }
        }

        function checkCookie() {
            const resultDiv = document.getElementById('cookie-result');
            const cookies = document.cookie;
            
            log('Checking for refresh_token cookie...', 'info');
            
            // Note: HTTP-Only cookies cannot be read by JavaScript
            if (cookies.includes('refresh_token')) {
                resultDiv.innerHTML = `<p class="success">✅ Refresh token cookie found!</p>
                    <p class="info">⚠️ Note: You can see it here because it's not HttpOnly in local dev. In production, it would be invisible to JavaScript.</p>`;
                log('Refresh token cookie detected.', 'success');
            } else {
                resultDiv.innerHTML = `<p class="info">ℹ️ No refresh_token in readable cookies (expected for HTTP-Only cookies)</p>
                    <p>Check DevTools → Application → Cookies to see the HTTP-Only cookie.</p>`;
                log('HTTP-Only cookie not readable via JavaScript (expected).', 'info');
            }
        }

        async function testAuthRequest() {
            const resultDiv = document.getElementById('auth-result');
            const token = localStorage.getItem('token');
            
            if (!token) {
                resultDiv.innerHTML = `<p class="error">❌ No token found. Please login first.</p>`;
                log('No token in localStorage. Login required.', 'error');
                return;
            }

            try {
                log('Making authenticated request to /me...', 'info');
                
                const response = await fetch(`${API_URL}/me`, {
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                });

                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `<p class="success">✅ Request successful!</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>`;
                    log('Authenticated request successful.', 'success');
                } else {
                    resultDiv.innerHTML = `<p class="error">❌ Request failed: ${response.status}</p>`;
                    log(`Request failed with status ${response.status}`, 'error');
                }
            } catch (err) {
                resultDiv.innerHTML = `<p class="error">❌ Error: ${err.message}</p>`;
                log(`Request error: ${err.message}`, 'error');
            }
        }

        async function testAutoRefresh() {
            const resultDiv = document.getElementById('refresh-result');
            
            log('🧪 Starting auto-refresh test...', 'info');
            
            // Step 1: Set an invalid token
            log('Step 1: Setting expired/invalid token...', 'info');
            localStorage.setItem('token', 'expired_token_12345');
            resultDiv.innerHTML = '<p class="info">⏳ Token expired. Now making a request to trigger auto-refresh...</p>';
            
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Step 2: Make a request that should trigger refresh
            try {
                log('Step 2: Making request with expired token...', 'info');
                
                const response = await fetch(`${API_URL}/me`, {
                    headers: { 
                        'Authorization': `Bearer expired_token_12345`,
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include' // This sends the refresh_token cookie
                });

                if (response.status === 401) {
                    log('Step 3: Got 401, now calling /auth/refresh...', 'info');
                    
                    // Manual refresh call (in real app, axios does this automatically)
                    const refreshResponse = await fetch(`${API_URL}/auth/refresh`, {
                        method: 'POST',
                        credentials: 'include'
                    });

                    if (refreshResponse.ok) {
                        const refreshData = await refreshResponse.json();
                        localStorage.setItem('token', refreshData.token);
                        
                        log('Step 4: Token refreshed! Retrying original request...', 'success');
                        
                        // Retry original request
                        const retryResponse = await fetch(`${API_URL}/me`, {
                            headers: { 
                                'Authorization': `Bearer ${refreshData.token}`,
                                'Content-Type': 'application/json'
                            },
                            credentials: 'include'
                        });

                        if (retryResponse.ok) {
                            const userData = await retryResponse.json();
                            resultDiv.innerHTML = `<p class="success">🎉 Auto-Refresh Test PASSED!</p>
                                <p>✅ Expired token detected<br>
                                ✅ New token obtained from refresh endpoint<br>
                                ✅ Original request succeeded with new token</p>
                                <pre>${JSON.stringify(userData, null, 2)}</pre>`;
                            log('✅ AUTO-REFRESH TEST PASSED!', 'success');
                        }
                    } else {
                        resultDiv.innerHTML = `<p class="error">❌ Refresh failed. Please login again.</p>`;
                        log('Refresh failed. Session expired.', 'error');
                    }
                } else {
                    resultDiv.innerHTML = `<p class="error">❌ Unexpected response: ${response.status}</p>`;
                    log(`Unexpected status: ${response.status}`, 'error');
                }
            } catch (err) {
                resultDiv.innerHTML = `<p class="error">❌ Error: ${err.message}</p>`;
                log(`Auto-refresh test error: ${err.message}`, 'error');
            }
        }
    </script>
</body>
</html>
